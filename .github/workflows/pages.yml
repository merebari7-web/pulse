name: Pages

# Builds the site and publishes `dist/` to GitHub Pages.
# One-time setting in the repo: Settings → Pages → Build and deployment →
# Source: “GitHub Actions”. Every push to main then redeploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # the same gate the project ships with: 39 data/scene checks, the GLSL
      # contract check, a production build, 10 real @react-three/test-renderer
      # scene checks and 13 DOM checks. Pages never publishes a broken commit.
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
